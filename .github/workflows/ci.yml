name: Deliverables Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-deliverables:
    name: Verify IEEE Part-1 Deliverables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Documentation Files
        run: |
          test -f "docs/1_SRS_StudentRecordSystem.md"
          test -f "docs/2_TestPlan_StudentRecordSystem.md"
          test -f "docs/3_ArchitectureDesign_StudentRecordSystem.md"
          test -f "README.md"
          echo "All required Deliverables Part-1 documentation files are present and verified."
