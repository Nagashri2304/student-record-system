name: Deliverables & Test Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-deliverables:
    name: Verify IEEE Part-1 Deliverables & Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Documentation Files
        run: |
          test -f "docs/1_SRS_StudentRecordSystem.docx"
          test -f "docs/2_TestPlan_StudentRecordSystem.docx"
          test -f "docs/3_ArchitectureDesign_StudentRecordSystem.docx"
          test -f "docs/use_case_diagram.drawio"
          test -f "docs/use_case_diagram.png"
          test -f "README.md"
          echo "All required Deliverables Part-1 Word documents and draw.io diagrams are present and verified."

  test-backend:
    name: Backend Jest Test Suite (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Execute automated test suite (61 tests, 6 suites)
        run: npm test --prefix backend

  build-frontend:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend for production
        run: npm run build --prefix frontend
